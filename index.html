<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Viewer - Full</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading" class="loading">Loading data...</div>
    
    <div id="app" class="container" style="display: none;">
        <div class="sidebar">
            <div class="sidebar-header">ID List</div>
            <ul id="id-list" class="id-list"></ul>
        </div>
        
        <div class="main-content">
            <div class="header">
                <h1 id="input-header">Select an ID to view details</h1>
            </div>
            
            <div class="body">
                <div class="column">
                    <div class="column-header">A</div>
                    <div id="chat-a" class="chat-container"></div>
                </div>
                <div class="column">
                    <div class="column-header">B</div>
                    <div id="chat-b" class="chat-container"></div>
                </div>
                <div class="column">
                    <div class="column-header">C</div>
                    <div id="chat-c" class="chat-container"></div>
                </div>
                <div class="column">
                    <div class="column-header">D</div>
                    <div id="chat-d" class="chat-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
